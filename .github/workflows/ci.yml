name: ci
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgtk-4-dev xvfb openbox scrot python3-pil python3

      - name: Show compiler and GTK version
        run: |
          gcc --version
          pkg-config --modversion gtk4

      # ---- Banker engine (Baseline verification) ----

      - name: Build engine and CLI
        run: make

      - name: Run Banker test suite
        run: make test

      - name: Banker UndefinedBehaviorSanitizer
        run: make ubsan

      - name: Banker AddressSanitizer + UBSan
        run: make sanitize

      # ---- Threading module (POSIX threads) ----

      - name: Run threading tests
        run: make test_threads

      - name: Threading UndefinedBehaviorSanitizer
        run: make test_threads_ubsan

      # ---- Sanitizer capability probes & executions ----
      - name: Probe ThreadSanitizer capability
        id: tsan_probe
        run: |
          if echo 'int main(void){return 0;}' | gcc -pthread -fsanitize=thread -x c - -o /tmp/tsan_probe 2>/dev/null && /tmp/tsan_probe 2>/dev/null; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "ThreadSanitizer runtime is supported."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ThreadSanitizer runtime unavailable on runner (probe failed). Skipping tsan."
          fi
          rm -f /tmp/tsan_probe

      - name: Run ThreadSanitizer tests
        if: steps.tsan_probe.outputs.supported == 'true'
        run: make tsan

      - name: Probe AddressSanitizer capability
        id: asan_probe
        run: |
          if echo 'int main(void){return 0;}' | gcc -pthread -fsanitize=address,undefined -x c - -o /tmp/asan_probe 2>/dev/null && /tmp/asan_probe 2>/dev/null; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "AddressSanitizer runtime is supported."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AddressSanitizer runtime unavailable on runner (probe failed). Skipping asan."
          fi
          rm -f /tmp/asan_probe

      - name: Run AddressSanitizer threading tests
        if: steps.asan_probe.outputs.supported == 'true'
        run: make test_threads_sanitize

      # ---- GTK4 Desktop Application ----

      - name: Build GTK4 Desktop Application
        run: make gui

      - name: Run GTK4 Application Smoke Test
        run: |
          GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -s "-screen 0 1280x800x24" \
            ./resourceguard_gui --smoke-test

      - name: Capture Live X11 Window Screenshot
        run: |
          xvfb-run -s "-screen 0 1280x800x24" bash -c '
            set -e
            openbox &
            OB_PID=$!
            sleep 1

            GDK_BACKEND=x11 GSK_RENDERER=cairo ./resourceguard_gui &
            GUI_PID=$!
            sleep 3

            # Verify GUI process is still alive and did not crash on startup
            if ! kill -0 $GUI_PID 2>/dev/null; then
              echo "ERROR: resourceguard_gui crashed or exited unexpectedly!"
              exit 1
            fi

            scrot -z screenshot.png

            kill -TERM $GUI_PID 2>/dev/null || true
            wait $GUI_PID 2>/dev/null || true
            kill -TERM $OB_PID 2>/dev/null || true
          '

      - name: Validate Screenshot Content (Non-Blank / Non-Black)
        run: |
          python3 -c "
          import sys, os
          from PIL import Image

          target = 'screenshot.png'
          if not os.path.exists(target):
              print(f'FAILURE: {target} was not generated.')
              sys.exit(1)

          size = os.path.getsize(target)
          print(f'Inspecting {target}: file size = {size} bytes')
          if size < 1000:
              print(f'FAILURE: {target} is suspiciously small ({size} bytes).')
              sys.exit(1)

          img = Image.open(target)
          print(f'Dimensions: {img.size}')
          extrema = img.getextrema()
          print(f'Pixel extrema: {extrema}')

          colors = img.getcolors(maxcolors=200000)
          n_colors = len(colors) if colors else 200000
          print(f'Unique colors: {n_colors}')

          max_val = max(e[1] if isinstance(e, tuple) else e for e in extrema)
          if max_val < 30:
              print(f'FAILURE: {target} is completely black (max pixel value: {max_val}).')
              sys.exit(1)

          if n_colors < 10:
              print(f'FAILURE: {target} lacks visual structure ({n_colors} unique colors).')
              sys.exit(1)

          print(f'VALIDATION SUCCESS: {target} contains authentic rendered GUI content ({n_colors} colors, {size} bytes).')
          "

      - name: Upload GTK4 Application Screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk4-app-screenshot
          path: screenshot.png
          if-no-files-found: error
